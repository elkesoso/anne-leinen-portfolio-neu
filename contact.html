<!DOCTYPE html>
<html class="light" lang="de">
<head>
<meta charset="utf-8"/>
  <link rel="preload" href="assets/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=1.5">

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Kontakt | Anne Leinen</title><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="tokens.js"></script>
<style>
  html { scrollbar-gutter: stable; background-color: #77591f; }
  body { background-color: #77591f; min-height: 100vh; }
  body > main, body > footer { max-width: 1440px; margin-left: auto; margin-right: auto; }
  body > nav { max-width: 1440px; left: 50%; transform: translateX(-50%); }
  #mobile-menu { max-width: 1440px; left: 50%; transform: translateX(-50%); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align: middle; }
  #mobile-menu { display: none; }
  #mobile-menu.open { display: flex; }
  /* Fokus-Farbe: Gold statt Browser-Blau */
  #contact-form input:focus,
  #contact-form textarea:focus {
    border-color: #c9a96e !important;
    outline: none;
    box-shadow: none;
  }
  /* Textarea: mobil kompakter */
  @media (max-width: 767px) {
    #field-message { height: 60px !important; min-height: 60px !important; }
  }
  @media (min-width: 768px) {
    #field-message { min-height: 8rem; }
  }
  .subject-radio input:checked + span { background-color: var(--color-primary); color: #ffffff; border-color: var(--color-primary); }
  .subject-radio input:focus-visible + span { outline: 2px solid var(--color-secondary-container); outline-offset: 2px; }
  .contact-submit:disabled { background-color: rgba(39,25,0,0.18); color: rgba(39,25,0,0.48); box-shadow: none; filter: none; }
</style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="bg-nav-bg font-body selection:bg-primary-container selection:text-on-primary-container">

<!-- NAV -->
<nav style="background-color: rgba(255, 248, 247, 0.9);" class="fixed top-0 w-full z-50 backdrop-blur-lg flex justify-between items-center px-8 md:px-16 py-2">
  <a href="index.html" class="flex items-center gap-4 transition-opacity hover:opacity-80">
    <img src="assets/logo.webp" alt="Artful Anne Logo" class="h-12 w-auto" loading="eager" width="200" height="201">
    <span class="font-headline font-light text-base uppercase tracking-[0.2em] text-on-surface">ARTFUL_ANNE</span>
  </a>
  <div class="flex items-center">
    <div class="hidden lg:flex gap-10 font-headline text-sm tracking-wide">
      <a href="index.html"       class="text-on-surface-variant hover:text-on-surface transition-colors duration-300">Home</a>
      <a href="artworks.html"    class="text-on-surface-variant hover:text-on-surface transition-colors duration-300">Kunstwerke</a>
      <a href="exhibitions.html" class="text-on-surface-variant hover:text-on-surface transition-colors duration-300">Ausstellungen</a>
      <a href="contact.html"     class="text-on-surface border-b border-on-surface/40 pb-1">Kontakt</a>
    </div>
    <div class="hidden lg:block w-[1px] h-4 bg-black/10 ml-12 mr-4"></div>
    <a href="https://instagram.com/artful__anne" target="_blank" rel="noopener" aria-label="Anne Leinen auf Instagram" class="p-3 -mr-3 text-on-surface-variant hover:text-on-surface transition-colors duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4.5"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <button id="menu-toggle" class="lg:hidden text-on-surface-variant ml-4"><span class="material-symbols-outlined">menu</span></button>
  </div>
</nav>

<!-- MOBILE MENU -->
<div id="mobile-menu" class="fixed top-0 left-0 w-full h-full z-40 bg-nav-bg flex-col items-center justify-center gap-10">
  <button id="menu-close" class="absolute top-6 right-8 text-secondary-container"><span class="material-symbols-outlined text-3xl">close</span></button>
  <a href="index.html"       onclick="closeMenu()" class="font-headline text-3xl text-secondary-fixed">Home</a>
  <a href="artworks.html"    onclick="closeMenu()" class="font-headline text-3xl text-secondary-fixed">Kunstwerke</a>
  <a href="exhibitions.html" onclick="closeMenu()" class="font-headline text-3xl text-secondary-fixed">Ausstellungen</a>
  <a href="contact.html"      onclick="closeMenu()" class="font-headline text-3xl text-white">Kontakt</a>
</div>

<main class="pt-32 pb-24">

  <!-- PAGE HEADER -->
  <header class="px-8 md:px-24 mb-20 max-w-7xl mx-auto" data-contact-render="header"></header>

  <div class="px-8 md:px-24 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-24 items-start">
    <div class="order-2 md:order-1" data-contact-render="form"></div>
    <div class="flex flex-col md:self-stretch order-1 md:order-2" data-contact-render="info"></div>
  </div>

  <!-- AUFTRAGSARBEITEN -->
  <div class="px-8 md:px-24 max-w-7xl mx-auto mt-12 md:mt-16" data-contact-render="commission"></div>

  <!-- FAQ -->
  <section class="px-8 md:px-24 max-w-7xl mx-auto mt-12 md:mt-20" data-contact-render="faq"></section>

</main>

<!-- FOOTER -->
<footer class="bg-footer-bg flex flex-col md:flex-row justify-between items-center px-12 py-16 gap-8 border-t border-secondary-fixed/10 mt-24">
  <div class="font-headline italic text-lg text-secondary-fixed">Anne Leinen</div>
  <div class="font-label text-[10px] tracking-[0.2em] uppercase text-secondary-fixed/50 text-center">© 2026 Anne Leinen. Alle Rechte vorbehalten.</div>
  <div class="flex gap-8">
    <a href="impressum.html" class="font-label text-[10px] tracking-[0.2em] uppercase text-secondary-fixed/50 hover:text-white transition-colors duration-300 underline underline-offset-8">Impressum</a>
    <a href="datenschutz.html" class="font-label text-[10px] tracking-[0.2em] uppercase text-secondary-fixed/50 hover:text-white transition-colors duration-300">Datenschutz</a>
  </div>
</footer>

<script>
  const toggle = document.getElementById('menu-toggle');
  const menu = document.getElementById('mobile-menu');
  const closeBtn = document.getElementById('menu-close');
  toggle.addEventListener('click', () => menu.classList.add('open'));
  closeBtn.addEventListener('click', () => menu.classList.remove('open'));
  function closeMenu() { menu.classList.remove('open'); }
</script>
<script src="data.js?v=1.15"></script>
<script src="contact-form.js?v=1.1"></script>
<script src="contact-page.js?v=1.0"></script>
</body>
</html>
